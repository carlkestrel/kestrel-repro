name: CI Fast

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'dev/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest pytest-cov pytest-xdist pytest-timeout \
            coverage pytest-junit-xml || \
            pip install -e pytest pytest-cov pytest-xdist pytest-timeout \
            coverage pytest-junit-xml

      - name: Run plugin discovery (manifest parsing)
        run: |
          python -m pytest tests/test_plugin_discovery.py -v \
            --junit-xml=reports/test_plugin_discovery.xml \
            --cov=src \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing

      - name: Run startup + config schema + CLI parsing
        run: |
          python -m pytest tests/test_startup.py -v \
            --junit-xml=reports/test_startup.xml

      - name: Run state machine
        run: |
          python -m pytest tests/test_state_machine.py -v \
            --junit-xml=reports/test_state_machine.xml

      - name: Run orchestrator unit tests
        run: |
          python -m pytest tests/test_orchestrator.py \
            -v \
            -k "test_1_ or test_4_ or test_5_ or test_14_ or test_15_" \
            --junit-xml=reports/test_orchestrator.xml \
            --timeout=60

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            reports/*.xml
          retention-days: 14

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Run ruff
        run: ruff check src/ tests/ --output-format=github || true

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports || true

  summary:
    name: Fast CI Summary
    needs: [unit-tests, lint-and-typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          pattern: test-reports-*
          path: reports/
          merge-multiple: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@a9d1173ed7f9489208e4e29c2c8e12e49e87de3a  # v2.12.0
        with:
          files: reports/*.xml
          check_name: Fast CI Test Results
          comment_title: Fast CI Results
          comment_mode: always (replace)

      - name: Summary
        run: |
          echo "## Fast CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python versions: 3.11, 3.12, 3.13" >> $GITHUB_STEP_SUMMARY
          echo "- No GPU required" >> $GITHUB_STEP_SUMMARY
